# Canonical Harbor publish — secrets: HARBOR_HOST, HARBOR_USER, HARBOR_PASS, HARBOR_PROJECT
# IMAGE_REPO must match repo name (e.g. daletdex-ltc-worker).
# Harbor tag == git tag. Push to main does NOT publish; push semver tag vX.Y.Z does.
# After push: Cosign keyless sign + verify by digest (GitHub OIDC).

name: docker-harbor

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: harbor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # Cosign keyless (GitHub OIDC → Fulcio)

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Harbor settings
        id: harbor
        shell: bash
        env:
          HARBOR_HOST: ${{ secrets.HARBOR_HOST }}
          HARBOR_PROJECT: ${{ secrets.HARBOR_PROJECT }}
        run: |
          set -euo pipefail
          REGISTRY="${HARBOR_HOST:-}"
          PROJECT="${HARBOR_PROJECT:-}"
          if [[ -z "${REGISTRY}" ]]; then
            echo "HARBOR_HOST must be set (hostname only, e.g. registry.example.com)" >&2
            exit 1
          fi
          if [[ -z "${PROJECT}" ]]; then
            echo "HARBOR_PROJECT must be set" >&2
            exit 1
          fi
          REGISTRY="${REGISTRY#https://}"
          REGISTRY="${REGISTRY#http://}"
          REGISTRY="${REGISTRY%%/*}"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "project=${PROJECT}" >> "$GITHUB_OUTPUT"

      - name: Set image tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "Harbor publish requires a semver git tag (vX.Y.Z)." >&2
            exit 1
          fi
          echo "IMAGE_TAG=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ steps.harbor.outputs.registry }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASS }}

      - name: Build & push
        id: image
        env:
          IMAGE_REPO: daletdex-caddy
          DOCKERFILE: docker/Dockerfile
          CONTEXT: .
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.IMAGE_TAG }}"
          REGISTRY="${{ steps.harbor.outputs.registry }}"
          PROJECT="${{ steps.harbor.outputs.project }}"
          IMAGE="${REGISTRY}/${PROJECT}/${IMAGE_REPO}:${TAG}"
          docker build --pull -f "${DOCKERFILE}" -t "${IMAGE}" "${CONTEXT}"
          docker push "${IMAGE}"

          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}" | cut -d@ -f2)"
          if [[ -z "${DIGEST}" || "${DIGEST}" != sha256:* ]]; then
            echo "Failed to resolve image digest after push" >&2
            exit 1
          fi
          echo "image=${REGISTRY}/${PROJECT}/${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE} @ ${DIGEST}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          # v2 uses classic sha256-*.sig tags (Harbor-friendly). Keyless OIDC unchanged.
          cosign-release: v2.5.0

      - name: Sign image by digest (keyless OIDC)
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign version
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify signature
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp \
              '^https://github.com/daletdex/daletdex-caddy/\.github/workflows/docker-harbor\.yml@refs/(tags/v.+|heads/.+)$' \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"
